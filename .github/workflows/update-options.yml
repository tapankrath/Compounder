name: Update option chains

on:
  schedule:
    # Hourly at :15, 9:15am-5:15pm New York time (EDT), Mon-Fri. GitHub cron is UTC and can run a few minutes late.
    - cron: "15 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python scripts/fetch_options.py options.json
      - name: Commit if changed
        run: |
          git config user.name "options-bot"
          git config user.email "options-bot@users.noreply.github.com"
          git add options.json
          git diff --cached --quiet || (git commit -m "Update option chains" && git push)
