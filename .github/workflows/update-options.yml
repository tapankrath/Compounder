name: Update option chains

on:
  schedule:
    # Hourly at :30, Mon-Fri. GitHub cron is UTC, so this wakes for both daylight-saving and standard time;
    # the first step skips any run outside 9:30am-4:30pm New York time. Runs can start a few minutes late.
    - cron: "30 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

# Never run two of these at once (they would both try to save options.json)
concurrency:
  group: update-options
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Only during market hours (9:30am-4:30pm New York)
        id: hours
        run: |
          now=$(TZ=America/New_York date +%H%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$now" -ge 925 ] && [ "$now" -le 1659 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside market hours in New York ($now), skipping"; echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.hours.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.hours.outputs.run == 'true'
        with:
          python-version: "3.12"
      - run: pip install yfinance
        if: steps.hours.outputs.run == 'true'
      - run: python scripts/fetch_options.py "$RUNNER_TEMP/options.json"
        if: steps.hours.outputs.run == 'true'
      - name: Save options.json (newest quotes always win)
        if: steps.hours.outputs.run == 'true'
        run: |
          git config user.name "options-bot"
          git config user.email "options-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/options.json" options.json
            git add options.json
            if git diff --cached --quiet; then echo "No change"; exit 0; fi
            git commit -m "Update option chains"
            if git push origin HEAD:main; then echo "Saved"; exit 0; fi
            echo "Push raced with another change, retrying ($attempt)"; sleep 5
          done
          exit 1
